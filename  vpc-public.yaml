AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation for VPC'

Resources:
# my vpc
  MyVPC:
   Type: 'AWS::EC2::VPC'
   Properties:
     CidrBlock: '172.16.0.0/16'
     EnableDnsSupport: true
     EnableDnsHostnames: true
     Tags:
       - Key: Name
         Value: MyVPC

        
  PublicSubnet1A:
#Public Subnet in AZ 1
    Type: 'AWS::EC2::Subnet'
    Properties:
     VpcId: !Ref MyVPC
     CidrBlock: '172.16.1.0/24'
     AvailabilityZone: !Select [0, !GetAZs '']
     MapPublicIpOnLaunch: true
     Tags:
       - Key: Name 
         Value: PublicSubnet1A

  AppPrivateSubnet1A:
#App Private Subnet in AZ 1
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: '172.16.2.0/24'
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: AppPrivateSubnet1A

  DataPrivateSubnet1A:
#Data Private Subnet in AZ 1
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: '172.16.3.0/24' 
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: DataPrivateSubnet1A


  PublicSubnet2B:
#Public Subnet in AZ 2
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: '172.16.4.0/24'
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: PublicSubnet2B


  AppPrivateSubnet2B:
#App Private Subnet in AZ 2
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: '172.16.5.0/24'
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: AppPrivateSubnet2B


  DataPrivateSubnet2B:
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref MyVPC
      CidrBlock: '172.16.6.0/24'
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: DataPrivateSubnet2B

#internet gateway
  InternetGateway:
    Type: 'AWS::EC2::InternetGateway'
    Properties:
      Tags:
        - Key: Name
          Value: MyVPC-IGW

#Attach the internet gateway to the VPC
  AttachGateway:
    Type: 'AWS::EC2::VPCGatewayAttachment'
    Properties:
      VpcId: !Ref MyVPC
      InternetGatewayId: !Ref InternetGateway



#PublicRouteTables
  PublicRouteTable:
    Type: 'AWS::EC2::RouteTable'
    Properties:
      VpcId: !Ref MyVPC
      Tags:
        - Key: Name
          Value: PublicRouteTable

  
#Public Routes
  PublicRoute:
    Type: 'AWS::EC2::Route'
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref InternetGateway

#Public Subnet 1A Route Table Associations
  PublicSubnet1ARouteTableAssociation:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    Properties:
      SubnetId: !Ref PublicSubnet1A
      RouteTableId: !Ref PublicRouteTable

 #Public Subnet 2BRoute Table Associations
  PublicSubnet2BRouteTableAssociation:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    Properties:
      SubnetId: !Ref PublicSubnet2B
      RouteTableId: !Ref PublicRouteTable


#Bastion Host EC2
  BastionHost:
    Type: 'AWS::EC2::Instance'
    Properties:
      InstanceType: t3.micro
      KeyName:  cloudformation-keypair
      ImageId: ami-0e5df6fd7455a69b3
      SubnetId: !Ref PublicSubnet2B
      SecurityGroupIds: 
        - !Ref BastionSG
      Tags:
        - Key: Name
          Value: BastionHost


#Bastion Security Group
  BastionSG:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: 'Enable SSH access' 
      VpcId: !Ref MyVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 203.0.113.10/32

#AppInstance1A
  AppInstance1A:
   Type: 'AWS::EC2::Instance'
   Properties:
     InstanceType: t3.micro
     KeyName: cloudformation-keypair
     ImageId: ami-0e5df6fd7455a69b3
     SubnetId: !Ref AppPrivateSubnet1A
     SecurityGroupIds:
       - !Ref AppInstance1ASG
     Tags:
      - Key: Name
        Value: App1


      #AppInstance2B
  AppInstance2B:
    Type: 'AWS::EC2::Instance'
    Properties:
      InstanceType: t3.micro
      KeyName: cloudformation-keypair
      ImageId: ami-0e5df6fd7455a69b3
      SubnetId: !Ref AppPrivateSubnet2B
      SecurityGroupIds: 
        - !Ref AppInstance2BSG
      Tags:
       - Key: Name
         Value: App2


#SG App 1A
  AppInstance1ASG:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: 'Allow SSH access from Bastion'
      VpcId: !Ref MyVPC
      SecurityGroupIngress:
         - IpProtocol: tcp
           FromPort: 22
           ToPort: 22
           SourceSecurityGroupId: !Ref BastionSG


           #SG App 2B
  AppInstance2BSG:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: 'Allow ICMP ping from App1'
      VpcId: !Ref MyVPC
      SecurityGroupIngress:
         - IpProtocol: icmp
           FromPort: -1
           ToPort: -1
           SourceSecurityGroupId: !Ref AppInstance1ASG          
           



